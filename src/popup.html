<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Popup</title>
    <style>
      :root {
        --border: #d9d9d9;
        --muted: #6b7280;
        --bg-soft: #f6f7f8;
        --accent: #111827;
      }

      body {
        font: 14px system-ui, sans-serif;
        min-width: 300px;
        margin: 0;
        padding: 14px;
        color: #111;
      }

      h3 {
        margin: 0;
        font-size: 16px;
      }

      button,
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }

      button {
        padding: 9px 12px;
        background: #fff;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      select,
      input {
        padding: 8px 10px;
      }

      .row { margin-top: 10px; }
      .muted { color: var(--muted); font-size: 12px; }
      .stack { display: grid; gap: 8px; }
      .targetHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .quickTargets {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .quickTargetsSwap {
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        user-select: none;
      }
      .quickTarget {
        width: 84px;
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 999px;
      }
      .quickTarget.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .panel {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-soft);
      }

      details {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }

      summary {
        padding: 10px 12px;
        cursor: pointer;
        list-style: none;
        font-size: 13px;
        font-weight: 600;
      }

      details[open] summary {
        border-bottom: 1px solid var(--border);
      }

      .detailsBody {
        padding: 0 12px 12px;
      }

      .inlineCheckbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .twoCol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

    </style>
  </head>
  <body>
    <h3>翻訳</h3>
    <div id="version" class="muted" style="margin-top: 2px;"></div>

    <div class="panel">
      <div class="targetHeader">
        <label style="display: block; font-size: 12px;">自動検出ペア</label>
        <div class="quickTargets" aria-label="よく使う翻訳先">
          <select class="quickTarget" id="quickTargetPrimary" data-target-slot="primary">
            <option value="ja">日本語</option>
            <option value="en">英語</option>
            <option value="th">タイ語</option>
            <option value="hi">ヒンディー語</option>
          </select>
          <span class="quickTargetsSwap" aria-hidden="true">⇄</span>
          <select class="quickTarget" id="quickTargetSecondary" data-target-slot="secondary">
            <option value="ja">日本語</option>
            <option value="en">英語</option>
            <option value="th">タイ語</option>
            <option value="hi">ヒンディー語</option>
          </select>
        </div>
      </div>
      <div class="muted" style="margin-bottom: 6px;">選択テキストはこの2言語から自動判定します。</div>
      <div class="row stack">
        <button id="restoreOriginal">原文に戻す</button>
      </div>
    </div>

    <details id="settingsSection">
      <summary>設定 <span id="settingsSummary" class="muted" style="font-weight: 400;"></span></summary>
      <div class="detailsBody">
        <div class="row">
          <label for="provider" style="display: block; margin-bottom: 4px; font-size: 12px;">Provider</label>
          <select id="provider">
            <option value="claude">Claude</option>
            <option value="sakura">Sakura AI</option>
          </select>
        </div>
        <div class="row">
          <label id="apiKeyLabel" for="apiKey" style="display: block; margin-bottom: 4px; font-size: 12px;">Claude API Key</label>
          <input type="password" id="apiKey" placeholder="sk-ant-..." />
        </div>
        <div class="row" id="modelRow">
          <label for="model" style="display: block; margin-bottom: 4px; font-size: 12px;">Model</label>
          <select id="model">
            <option value="claude-haiku-4-5-20251001">Claude 4.5 Haiku</option>
          </select>
        </div>
        <div class="row">
          <label class="inlineCheckbox">
            <input type="checkbox" id="showOriginal" checked style="width: auto; cursor: pointer;" />
            <span>原文表示（マウスオーバーで表示）</span>
          </label>
        </div>
        <div class="row muted">選択テキストの「翻訳」や「翻訳結果を表示」は、上部の2言語を見て自動で翻訳先を決めます。</div>
      </div>
    </details>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
