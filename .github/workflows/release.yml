name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0 のような形式のタグ
  workflow_dispatch:  # 手動実行も可能

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # リリースを作成するために必要
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # タグ情報を取得するため

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm build:chrome

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Create ZIP files
        run: |
          pnpm build:zip:chrome
          pnpm build:zip:firefox

      - name: Get version from tag
        id: get_version
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ タグからバージョンを取得: $VERSION"
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "⚠️ タグが見つかりません。devとして処理します。"
          fi

      - name: Check ZIP files exist
        run: |
          if [ ! -f "extension.zip" ]; then
            echo "❌ extension.zipが見つかりません"
            exit 1
          fi
          if [ ! -f "extension-firefox.zip" ]; then
            echo "❌ extension-firefox.zipが見つかりません"
            exit 1
          fi
          ls -lh extension.zip extension-firefox.zip
          echo "✅ ZIPファイルが存在します"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            extension.zip
            extension-firefox.zip
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 リリース ${{ steps.get_version.outputs.version }}

            ### 📦 インストール方法

            #### Chrome版
            1. `extension.zip`をダウンロード
            2. ZIPファイルを解凍
            3. Chromeで `chrome://extensions/` を開く
            4. 「開発者モード」を有効にする
            5. 「パッケージ化されていない拡張機能を読み込む」をクリック
            6. 解凍したフォルダを選択

            #### Firefox版
            1. `extension-firefox.zip`をダウンロード
            2. ZIPファイルを解凍
            3. Firefoxで `about:debugging` を開く
            4. 「このFirefox」タブを選択
            5. 「一時的なアドオンを読み込む」をクリック
            6. 解凍したフォルダ内の`manifest.json`を選択

            ### 📝 変更内容

            詳細は[コミット履歴](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }})を確認してください。

            ---
            **自動生成されたリリースです**
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') || contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

